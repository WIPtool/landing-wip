    <text x="88" y="230" font-size="15" fill="#6C7280">AB-1234 · 128.450 km</text>
    <circle cx="352" cy="196" r="7" fill="#F59E0B"/>

    <rect x="64" y="272" width="312" height="92" rx="14" fill="#FFFFFF" stroke="#E7E9EE"/>
    <text x="88" y="308" font-size="19" font-weight="700" fill="#161D31">Grúa 02 · Wheel lift</text>
    <text x="88" y="336" font-size="15" fill="#6C7280">CD-5678 · 96.120 km</text>
    <circle cx="352" cy="302" r="7" fill="#5FBE2E"/>

    <rect x="64" y="378" width="312" height="92" rx="14" fill="#FFFFFF" stroke="#E7E9EE"/>
    <text x="88" y="414" font-size="19" font-weight="700" fill="#161D31">Grúa 03 · Plataforma</text>
    <text x="88" y="442" font-size="15" fill="#6C7280">EF-9012 · 54.870 km</text>
    <circle cx="352" cy="408" r="7" fill="#5FBE2E"/>

    <rect x="64" y="484" width="312" height="92" rx="14" fill="#FFFFFF" stroke="#E7E9EE"/>
    <text x="88" y="520" font-size="19" font-weight="700" fill="#161D31">Camioneta de apoyo</text>
    <text x="88" y="548" font-size="15" fill="#6C7280">GH-3456 · 71.300 km</text>
    <circle cx="352" cy="514" r="7" fill="#C23B31"/>

    <circle cx="80" cy="624" r="7" fill="#5FBE2E"/><text x="96" y="629" font-size="14" fill="#6C7280">Documentos al día</text>
    <circle cx="80" cy="654" r="7" fill="#F59E0B"/><text x="96" y="659" font-size="14" fill="#6C7280">Un documento por vencer</text>
    <circle cx="80" cy="684" r="7" fill="#C23B31"/><text x="96" y="689" font-size="14" fill="#6C7280">Documento vencido</text>

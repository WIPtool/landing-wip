    <path d="M112 74 V22 a8 8 0 0 1 8 -8 h22 l20 26 v34 z" fill="#F2A33A"/>
    <rect x="124" y="20" width="22" height="18" rx="3" fill="#FFFFFF"/>
    <line x1="18" y1="40" x2="70" y2="4" stroke="#161D31" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="4" x2="70" y2="26" stroke="#161D31" stroke-width="3"/>
    <path d="M64 26 h12 l-6 8 z" fill="#161D31"/>
    <circle cx="28" cy="80" r="13" fill="#161D31"/><circle cx="28" cy="80" r="5" fill="#9AA1AD"/>
    <circle cx="140" cy="80" r="13" fill="#161D31"/><circle cx="140" cy="80" r="5" fill="#9AA1AD"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="672" y="176" font-size="32" font-weight="800" fill="#161D31">Grúa 01 · Planchón</text>
    <text x="672" y="208" font-size="17" fill="#6C7280">Isuzu NQR 2021 · Operador asignado: Carlos Ruiz</text>
    <rect x="672" y="226" width="150" height="40" rx="10" fill="#161D31"/>
    <text x="747" y="253" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="2">AB-1234</text>
    <text x="1180" y="166" font-size="14" fill="#8A94A6" letter-spacing="1">KILOMETRAJE ACTUAL</text>
    <text x="1180" y="206" font-size="36" font-weight="800" fill="#161D31">128.450 km</text>
    <text x="1180" y="234" font-size="14" fill="#6C7280">Con foto del odómetro · 18 oct</text>
  </g>

  <!-- Pestañas -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="17">
    <text x="440" y="330" font-weight="700" fill="#161D31">Documentos</text>

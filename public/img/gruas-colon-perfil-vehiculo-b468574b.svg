    <text x="1380" y="392" font-size="13" font-weight="700" fill="#8A94A6" letter-spacing="1">EVIDENCIA</text>

    <line x1="440" y1="410" x2="1524" y2="410" stroke="#EFF1F4" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Perfil de una grúa en WIP con su placa, kilometraje y documentos con fecha de vencimiento">
  <defs>
    <filter id="sombra" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#161D31" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#F5F6F8"/>
  <g filter="url(#sombra)"><rect x="40" y="36" width="1520" height="828" rx="24" fill="#FFFFFF"/></g>

  <!-- Barra superior -->
  <path d="M40 60 a24 24 0 0 1 24 -24 h1472 a24 24 0 0 1 24 24 v40 h-1520 z" fill="#161D31"/>
  <text x="76" y="86" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#C8EB54">wip</text>
  <text x="140" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#C9CEDA">Flota · Grúas Colón</text>
  <rect x="1360" y="58" width="168" height="36" rx="18" fill="#C8EB54"/>
  <text x="1444" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#161D31">+ Agregar vehículo</text>


    <text x="900" y="452" font-size="18" fill="#6C7280">—</text>
    <rect x="1090" y="430" width="104" height="32" rx="16" fill="#E6F5DD"/><text x="1142" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#3C8A16">Al día</text>
    <rect x="1380" y="428" width="70" height="36" rx="8" fill="#EEF1F4"/><text x="1415" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#2C334A">PDF</text>

    <line x1="440" y1="482" x2="1524" y2="482" stroke="#EFF1F4" stroke-width="2"/>
    <text x="440" y="524" font-size="19" fill="#161D31">Revisión técnico-mecánica</text>
    <text x="900" y="524" font-size="18" fill="#6C7280">15 mar 2027</text>
    <rect x="1090" y="502" width="104" height="32" rx="16" fill="#E6F5DD"/><text x="1142" y="524" text-anchor="middle" font-size="15" font-weight="700" fill="#3C8A16">Vigente</text>
    <rect x="1380" y="500" width="70" height="36" rx="8" fill="#EEF1F4"/><text x="1415" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#2C334A">PDF</text>

    <line x1="440" y1="554" x2="1524" y2="554" stroke="#EFF1F4" stroke-width="2"/>
    <text x="440" y="596" font-size="19" fill="#161D31">Seguro / póliza del vehículo</text>
    <text x="900" y="596" font-size="18" fill="#6C7280">2 nov 2026</text>
    <rect x="1090" y="574" width="196" height="32" rx="16" fill="#FDF0D9"/><text x="1188" y="596" text-anchor="middle" font-size="15" font-weight="700" fill="#A15C07">Vence en 12 días</text>
    <rect x="1380" y="572" width="70" height="36" rx="8" fill="#EEF1F4"/><text x="1415" y="596" text-anchor="middle" font-size="14" font-weight="700" fill="#2C334A">PDF</text>

    <line x1="440" y1="626" x2="1524" y2="626" stroke="#EFF1F4" stroke-width="2"/>
    <text x="440" y="668" font-size="19" fill="#161D31">Licencia del operador</text>
    <text x="900" y="668" font-size="18" fill="#6C7280">20 ago 2027</text>
    <rect x="1090" y="646" width="104" height="32" rx="16" fill="#E6F5DD"/><text x="1142" y="668" text-anchor="middle" font-size="15" font-weight="700" fill="#3C8A16">Vigente</text>
    <rect x="1380" y="644" width="70" height="36" rx="8" fill="#EEF1F4"/><text x="1415" y="668" text-anchor="middle" font-size="14" font-weight="700" fill="#2C334A">JPG</text>

    <line x1="440" y1="698" x2="1524" y2="698" stroke="#EFF1F4" stroke-width="2"/>
    <rect x="440" y="726" width="1084" height="96" rx="16" fill="#F3FADB"/>
    <text x="472" y="766" font-size="18" font-weight="700" fill="#161D31">Alertas antes del vencimiento</text>
    <text x="472" y="796" font-size="17" fill="#2C334A">WIP avisa cuando un documento está por vencer, para renovarlo a tiempo y no dejar la grúa fuera de servicio.</text>

  <rect x="40" y="100" width="360" height="764" fill="#F8F9FB"/>
  <text x="72" y="146" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8A94A6" letter-spacing="1.5">VEHÍCULOS · 4</text>
  <g font-family="Arial, Helvetica, sans-serif">

    <text x="760" y="668" font-size="18" font-weight="700" fill="#161D31">$14</text>
    <rect x="890" y="644" width="44" height="52" rx="6" fill="#FFFFFF" stroke="#D5DAE3"/><line x1="898" y1="658" x2="926" y2="658" stroke="#C3C9D4" stroke-width="3"/><line x1="898" y1="668" x2="922" y2="668" stroke="#C3C9D4" stroke-width="3"/><line x1="898" y1="678" x2="926" y2="678" stroke="#C3C9D4" stroke-width="3"/>
    <text x="946" y="675" font-size="14" fill="#3C8A16">Recibo ✔</text>

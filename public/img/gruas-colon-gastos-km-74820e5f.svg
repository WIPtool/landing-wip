    <line x1="1092" y1="512" x2="1492" y2="512" stroke="#E7E9EE" stroke-width="2"/>
    <text x="1092" y="550" font-size="16" fill="#6C7280">Inicio de octubre</text>
    <text x="1492" y="550" text-anchor="end" font-size="18" font-weight="700" fill="#161D31">125.030 km</text>
    <text x="1092" y="588" font-size="16" fill="#6C7280">Lectura de hoy</text>
    <text x="1492" y="588" text-anchor="end" font-size="18" font-weight="700" fill="#161D31">128.450 km</text>
    <line x1="1092" y1="608" x2="1492" y2="608" stroke="#E7E9EE" stroke-width="2"/>
    <text x="1092" y="648" font-size="17" font-weight="700" fill="#161D31">Recorrido del mes</text>
    <text x="1492" y="648" text-anchor="end" font-size="26" font-weight="800" fill="#161D31">3.420 km</text>

    <rect x="1092" y="676" width="400" height="118" rx="14" fill="#F3FADB"/>
    <text x="1116" y="712" font-size="16" font-weight="700" fill="#161D31">Costo por kilómetro</text>
    <text x="1116" y="752" font-size="30" font-weight="800" fill="#161D31">$0,26 / km</text>
    <text x="1116" y="778" font-size="14" fill="#2C334A">Gastos del mes ÷ km recorridos</text>

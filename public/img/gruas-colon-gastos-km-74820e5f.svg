    <rect x="890" y="556" width="44" height="52" rx="6" fill="#FFFFFF" stroke="#D5DAE3"/><line x1="898" y1="570" x2="926" y2="570" stroke="#C3C9D4" stroke-width="3"/><line x1="898" y1="580" x2="922" y2="580" stroke="#C3C9D4" stroke-width="3"/><line x1="898" y1="590" x2="926" y2="590" stroke="#C3C9D4" stroke-width="3"/>
    <text x="946" y="587" font-size="14" fill="#3C8A16">Factura ✔</text>
    <line x1="80" y1="624" x2="1012" y2="624" stroke="#EFF1F4" stroke-width="2"/>
    <!-- fila 4 -->
    <text x="80" y="668" font-size="17" fill="#6C7280">9 oct</text>
    <rect x="200" y="648" width="118" height="28" rx="14" fill="#EEF1F4"/><text x="259" y="667" text-anchor="middle" font-size="14" font-weight="700" fill="#2C334A">Peaje</text>

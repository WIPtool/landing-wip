    <text x="1292" y="375" text-anchor="middle" font-family="Courier New, monospace" font-size="34" font-weight="700" fill="#E8F3B5" letter-spacing="4">128450</text>
    <text x="1292" y="418" text-anchor="middle" font-size="14" fill="#9AA1AD">km</text>
    <rect x="1104" y="270" width="142" height="28" rx="14" fill="rgba(200,235,84,0.9)"/>
    <text x="1175" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#161D31">Foto del odómetro</text>

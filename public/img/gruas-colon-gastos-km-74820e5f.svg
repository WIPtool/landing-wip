  <text x="76" y="86" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#C8EB54">wip</text>
  <text x="140" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#C9CEDA">Flota · Grúa 01 · Planchón · AB-1234</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Gastos de una grúa con foto de la factura como evidencia y registro del kilometraje con foto del odómetro">
  <defs>
    <filter id="sombra" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#161D31" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#F5F6F8"/>
  <g filter="url(#sombra)"><rect x="40" y="36" width="1520" height="828" rx="24" fill="#FFFFFF"/></g>

  <!-- Barra superior -->

    <text x="760" y="492" font-size="18" font-weight="700" fill="#161D31">$320</text>
    <rect x="890" y="468" width="44" height="52" rx="6" fill="#D9DEE6"/><circle cx="905" cy="484" r="5" fill="#FFFFFF"/><path d="M890 514 l14 -14 l10 10 l8 -6 l12 10 v6 h-44 z" fill="#9AA1AD"/>
